<text x="300" y="604.0" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2330">a seat free, and request</text>
<text x="300" y="634.5" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2330">first in the queue?</text>
