<text x="300" y="883.2" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2330">Mood tag (if known) and</text>
<text x="300" y="913.8" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2330">vehicle type within the</text>
<text x="300" y="944.2" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2330">passenger's choice?</text>
<polygon points="50,1180 130,1090 580,1090 500,1180" fill="#dcefdc" stroke="#2e7d32" stroke-width="3"/>
<text x="315" y="1143.8" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2330">Accept and notify users of match</text>
