<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1200" width="860" height="1200" font-family="Inter, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker></defs>
<rect width="860" height="1200" fill="#ffffff"/>
<rect x="85" y="20" width="430" height="80" rx="22" fill="#eceef2" stroke="#4b5262" stroke-width="3"/>
